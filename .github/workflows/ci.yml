name: CI
on:
    push:
        branches: '**'  # match all branches
        tags: '*'
    pull_request:
        branches: '**'  # match all branches
    workflow_dispatch:

concurrency:
    # Skip intermediate builds: always. Cancel intermediate builds: only on pull requests.
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
    test:
        name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        permissions:  # needed so julia-actions/cache can delete old caches it created
            actions: write
            contents: read
        strategy:
            fail-fast: false
            matrix:
                version: ['1.10', '1', 'pre']   # LTS (see Project.toml compat), current release, prerelease
                os: [ubuntu-latest, windows-latest, macos-latest]
                arch: [x64]
                exclude:
                    # keep the matrix affordable: only the current release on non-Linux
                    - {os: windows-latest, version: '1.10'}
                    - {os: windows-latest, version: 'pre'}
                    - {os: macos-latest, version: '1.10'}
                    - {os: macos-latest, version: 'pre'}
        steps:
            - uses: actions/checkout@v6
            - uses: julia-actions/setup-julia@v3
              with:
                version: ${{ matrix.version }}
                arch: ${{ matrix.arch }}
            - uses: julia-actions/cache@v2
            - uses: julia-actions/julia-buildpkg@v1
            - uses: julia-actions/julia-runtest@v1

    codecov:
        name: Code Coverage
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            actions: write
            contents: read
        steps:
            - uses: actions/checkout@v6
            - uses: julia-actions/setup-julia@v3
              with:
                  version: '1'
            - uses: julia-actions/cache@v2
            - uses: julia-actions/julia-buildpkg@v1
            - uses: julia-actions/julia-runtest@v1
            - uses: julia-actions/julia-processcoverage@v1
            - uses: codecov/codecov-action@v5
              with:
                files: lcov.info
                token: ${{ secrets.CODECOV_TOKEN }}
                fail_ci_if_error: false
