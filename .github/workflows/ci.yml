name: CI
on:
    push:
        branches: '**'  # match all branches
        tags: '*'
    pull_request:
        branches: '**'  # match all branches
    workflow_dispatch:

concurrency:
    # Skip intermediate builds: always. Cancel intermediate builds: only on pull requests.
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
    test:
        name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        permissions:  # needed so julia-actions/cache can delete old caches it created
            actions: write
            contents: read
        strategy:
            fail-fast: false
            # Explicit combinations rather than a product with excludes: macos-latest runners are
            # Apple Silicon, so they need aarch64 — asking for x64 there fails outright in
            # julia-actions/setup-julia@v3. Linux carries the version sweep (LTS per Project.toml
            # compat, current release, prerelease); Windows and macOS check the current release
            # only, to keep the matrix affordable.
            matrix:
                include:
                    - {os: ubuntu-latest,  version: '1.10', arch: x64}
                    - {os: ubuntu-latest,  version: '1',    arch: x64}
                    - {os: ubuntu-latest,  version: 'pre',  arch: x64}
                    - {os: windows-latest, version: '1',    arch: x64}
                    - {os: macos-latest,   version: '1',    arch: aarch64}
        steps:
            - uses: actions/checkout@v6
            - uses: julia-actions/setup-julia@v3
              with:
                version: ${{ matrix.version }}
                arch: ${{ matrix.arch }}
            - uses: julia-actions/cache@v3
            - uses: julia-actions/julia-buildpkg@v1
            - uses: julia-actions/julia-runtest@v1

    codecov:
        name: Code Coverage
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            actions: write
            contents: read
        steps:
            - uses: actions/checkout@v6
            - uses: julia-actions/setup-julia@v3
              with:
                  version: '1'
            - uses: julia-actions/cache@v3
            - uses: julia-actions/julia-buildpkg@v1
            - uses: julia-actions/julia-runtest@v1
            - uses: julia-actions/julia-processcoverage@v1
            - uses: codecov/codecov-action@v5
              with:
                files: lcov.info
                token: ${{ secrets.CODECOV_TOKEN }}
                fail_ci_if_error: false
